[project]
name = "llm-vlm-agents-course"
version = "0.1.0"
description = "Minimal starter for an individual LLM/VLM agent project"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastembed>=0.9.1,<1",
    "langgraph>=1.2.22,<2",
    "mcp>=1.12,<2",
    "openai>=1.100,<3",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
outfit-planner = "agent_project.cli:main"
outfit-planner-mcp = "agent_project.mcp_server:main"
outfit-index = "agent_project.retrieval:main"
outfit-ask = "agent_project.ask:main"
outfit-eval = "agent_project.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_project"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
